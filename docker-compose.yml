services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: meu-app-react:latest
    container_name: portfolio_front
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_INTERNAL_PORT}"

    restart: always
    environment:
      - NODE_ENV=production
    networks:
      - app-network

networks:
  app-network:
    driver: bridge