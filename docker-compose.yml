version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: meu-portfolio-react:latest
    restart: always
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`andreailtondev.tech`)" # Troque pelo seu domínio 
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls.certresolver=myresolver"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"
    networks:
      - app-network
      - traefik-public   # Conecta também na rede do Traefik

networks:
  app-network:
    driver: bridge
  traefik-public:
    external: true
